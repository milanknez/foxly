services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxly_web
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-foxly_user}:${POSTGRES_PASSWORD:-foxly_dev_pass}@postgres:5432/${POSTGRES_DB:-foxly_db}?schema=public}
      - S3_ENDPOINT=${S3_ENDPOINT_DOCKER:-minio}
      - S3_PORT=${S3_PORT:-9000}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-foxly-files}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change_in_production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3005}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: foxly_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-foxly_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-foxly_dev_pass}
      - POSTGRES_DB=${POSTGRES_DB:-foxly_db}
    volumes:
      - foxly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foxly_user} -d ${POSTGRES_DB:-foxly_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: foxly_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9005:9000"
      - "9006:9001"
      - "9006:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - foxly_miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: foxly_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  foxly_pgdata:
  foxly_miniodata:
